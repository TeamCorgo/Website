server {
    listen 80 default_server;
    client_max_body_size 1G;

    location / {
        # Reject Scrapeing software
        if ($http_user_agent ~* "python-requests") {
            return 403;
        }
        if ($http_user_agent ~* "Go-http-client") {
            return 403;
        }
        if ($http_user_agent ~* "Java") {
            return 403;
        }        
        if ($http_user_agent ~* "curl") {
            return 403;
        }                
        if ($http_user_agent ~* "lua") {
            return 403;
        }       
        if ($http_user_agent ~* "gobuster") {
            return 403;
        }       
        if ($http_user_agent ~* "Barracuda Sentinel") {
            return 403;
        }
    
        limit_req zone=addr burst=8 nodelay;
        limit_except GET {
            deny all;
        }

        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Serve robots.txt
    location = /robots.txt {
        # Disable access logging for this location
        access_log off;
    
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Other server configurations
    #error_page 400 401 403 404 500 502 503 504 = @error_redirect;
#
    #location @error_redirect {
    #    return 302 https://corgo.org;
    #}

    # don't send the nginx version number in error pages and Server header
    server_tokens off;

    # Secure cookies
    add_header Set-Cookie "Path=/; HttpOnly; Secure" always;

    # config to don't allow the browser to render the page inside an frame or iframe
    # and avoid clickjacking http://en.wikipedia.org/wiki/Clickjacking
    # if you need to allow [i]frames, you can use SAMEORIGIN or even set an uri with ALLOW-FROM uri
    # https://developer.mozilla.org/en-US/docs/HTTP/X-Frame-Options
   # add_header Content-Security-Policy "frame-ancestors 'self' corgo.org *.corgo.org;" always;

    # when serving user-supplied content, include a X-Content-Type-Options: nosniff header along with the Content-Type: header,
    # to disable content-type sniffing on some browsers.
    # https://www.owasp.org/index.php/List_of_useful_HTTP_headers
    # currently suppoorted in IE > 8 http://blogs.msdn.com/b/ie/archive/2008/09/02/ie8-security-part-vi-beta-2-update.aspx
    # http://msdn.microsoft.com/en-us/library/ie/gg622941(v=vs.85).aspx
    # 'soon' on Firefox https://bugzilla.mozilla.org/show_bug.cgi?id=471020
    add_header X-Content-Type-Options "nosniff" always;
    
    # This header enables the Cross-site scripting (XSS) filter built into most recent web browsers.
    # It's usually enabled by default anyway, so the role of this header is to re-enable the filter for 
    # this particular website if it was disabled by the user.
    # https://www.owasp.org/index.php/List_of_useful_HTTP_headers
    add_header X-XSS-Protection "1; mode=block";
    
    # Referrer Policy is a new header that allows a site to control how much information the browser includes with navigations away from a document and should be set by all sites.
    add_header Referrer-Policy "strict-origin";
    
    #	Content Security Policy is an effective measure to protect your site from XSS attacks. By whitelisting sources of approved content, you can prevent the browser from loading malicious assets. Analyse this policy in more detail. You can sign up for a free account on Report URI to collect reports about problems on your site.
    # add_header Content-Security-Policy "default-src 'self';" always;
    #add_header Content-Security-Policy "default-src 'self' corgo.org *.corgo.org; style-src 'self' corgo.org *.corgo.org;" always;


    add_header Content-Security-Policy "default-src 'self' corgo.org *.corgo.org; 
                                        style-src 'self' corgo.org *.corgo.org; 
                                        img-src 'self' https://s11.flagcounter.com; 
                                        frame-src 'self';" always;






    # Permissions Policy is a new header that allows a site to control which features and APIs can be used in the browser.
    add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
}
