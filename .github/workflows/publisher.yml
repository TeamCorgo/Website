
name: Publisher

on:
  workflow_dispatch:
  push:
    branches:
      - latest
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: Code

      - name: Clone DiceRoller repository
        run: git clone --depth=1 https://github.com/TeamCorgo/DiceRoller.git Code/dice

      - name: Clone SpaceMailRoom repository
        run: git clone --depth=1 https://github.com/TeamCorgo/SpaceMailRoom.git Code/mail

      - name: Clone Instrument Converter content
        run: |
          git clone --depth=1 https://github.com/TeamCorgo/Instrument_Converter.git /tmp/instruments
          mkdir -p Code/instruments
          cp -r /tmp/instruments/content/. Code/instruments/

      - name: Clone Image2Mega repository
        run: git clone --depth=1 https://github.com/TeamCorgo/Image2Mega.git Code/image2mega

      - name: Clone Cyberstorm patcher
        run: |
          git clone --depth=1 https://github.com/TeamCorgo/Cyberstorm-V1.3.git /tmp/cs-patch
          mkdir -p Code/cs-patch
          cp -r /tmp/cs-patch/patcher/. Code/cs-patch/

      - name: Clone Museum resources
        run: |
          git clone --depth=1 https://github.com/TeamCorgo/The-CyberStorm-Museum.git /tmp/Museum

          mkdir -p Code/cs-help
          mkdir -p Code/cs-tools/js
          mkdir -p Code/cs-tools/images
          mkdir -p Code/cs-tools/css

          cp -r /tmp/Museum/modern/help/. Code/cs-help/
          cp -r /tmp/Museum/tools/*.html Code/cs-tools/
          cp -r /tmp/Museum/tools/js/. Code/cs-tools/js/
          cp -r /tmp/Museum/tools/images/. Code/cs-tools/images/
          cp -r /tmp/Museum/tools/css/. Code/cs-tools/css/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Code

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      deployments: write

    steps:
      - name: Cleanup old deployment records
        uses: strumwolf/delete-deployment-environment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true
